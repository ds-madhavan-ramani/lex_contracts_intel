[project]
name = "lex-app"
requires-python = ">= 3.11"
version = "0.0.1"
description = ""
dependencies = [
    # Container runtime's minimum supported Streamlit version is 1.50 —
    # warehouse runtime is capped at whatever Snowflake's Conda channel
    # offers for this account. LEX runs on container runtime from the
    # start (STREAMLIT_COMPUTE_POOL_CONTRACT_MGMT) rather than migrating to it later, since a
    # modern Streamlit and predictable container resources both matter
    # more here than for a small meeting-minutes deployment: 100-500 page
    # OCR/indexing runs and up to ~600 documents at Scale phase. Pinned
    # exactly (not a >= floor) to the specific version confirmed working
    # on this account, avoiding resolver ambiguity.
    "streamlit[snowflake]==1.50.0",
    "pandas",
    # Pure Python, no system dependencies (no LibreOffice/Word install on
    # the compute pool) — used by docx_report.py to fill in the team's own
    # Contract Workspace Summary Template (assets/*.docx) with extracted
    # values for the downloadable summary.
    "python-docx>=1.1.0",
    # Pure Python, no system dependencies — used by pdf_report.py to
    # render the PDF version of the same Contract Workspace Summary (the
    # download-button counterpart to the .docx export above; also called
    # from contract_output_cache.py by the stage-pickup stored procedure —
    # see sql/04_stage_pickup_task.sql's PACKAGES note).
    "reportlab>=4.0.0",
]
