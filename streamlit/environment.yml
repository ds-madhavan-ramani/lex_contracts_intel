name: app_environment
channels:
  - snowflake
dependencies:
  # Inert on warehouse runtime: it defaults to whatever Streamlit version
  # Snowflake's Conda channel ships for this account regardless of what's
  # pinned here (confirmed on this template's own reference deployment —
  # not overridable even after a redeploy). LEX runs on container
  # runtime instead (see pyproject.toml), which does respect its
  # manifest's version pin. Kept in sync with pyproject.toml/
  # requirements.txt (1.50.0) purely so all three manifests state the same
  # target version, in case warehouse runtime is ever revisited.
  - streamlit=1.50.0
  - pandas
  # python-docx and reportlab (the Contract Summary Word/PDF exports) and
  # smbprotocol (the network drive ingestion tab) are deliberately NOT
  # listed here — all three are very unlikely to be resolvable from this
  # account's Anaconda channel
  # snapshot for warehouse-runtime Streamlit apps (the same class of
  # failure openpyxl hit in this template's own reference deployment,
  # which is why xlsx parsing there was rewritten to stdlib-only rather
  # than fixed here). Since LEX runs on container runtime by default
  # anyway (see pyproject.toml), this is only a real gap if warehouse
  # runtime is ever revisited — the summary download button and network
  # drive tab would both need a fallback or removal in that case.
